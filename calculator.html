<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/d437d2e5a9.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
    <section class="header">
        <div class="navbar">
            <img src="website logo.png" alt="Emission's Eye logo" width="auto" height="80%">
            <center>
                <h1>EmissionsEye</h1>
            </center>
        </div>
    </section>
    <section class="mainbody">
        <div id="leftpart">
            <div class="menuoptions">
                <div id="one">
                    <i class="fa-solid fa-house"></i>
                    <a href="index.html" class="links">Dashboard</a>
                </div>
                <div id="two">
                    <i class="fa-solid fa-calculator"></i>
                    <a href="calculator.html" class="links">Emission Calculator</a>
                </div>
                <div id="three">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    <a href="history.html" class="links">History</a>
                </div>
                <div id="four">
                    <i class="fa-solid fa-circle-info"></i>
                    <a href="education.html" class="links">Education</a>
                </div>
                <div id="five">
                    <i class="fa-solid fa-user"></i>
                    <a href="profile.html" class="links">Profile</a>
                </div>
                <div id="six">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <a href="cover.html" class="links">Logout</a>
                </div>
            </div>
        </div>
        <div id="rightpart">
            <div class="flip-card-main" >
                  <img src="Carbon Footprint.png" alt="">
                  <button onclick="flipCard()">Start</button>
            </div>
            <div id="flip-card-child" class="hidden">
                <div id="card-one" class="flip-card-hidden active">
                    <h2>How do you travel?</h2>
                    
                    <!-- Question 1 -->
                    <label>How many kilometers have you driven?</label>
                    <select id="vehicleType">
                        <option value="petrol">Petrol</option>
                        <option value="diesel">Diesel</option>
                        <option value="electric">Electric Vehicle</option>
                    </select>
                    <input type="number" id="vehicleDistance" placeholder="Enter distance (km)">
            
                    <!-- Question 2 -->
                    <label>How many kilometers have you traveled by public transport?</label>
                    <select id="publicTransport">
                        <option value="bus">Bus</option>
                        <option value="metro">Metro</option>
                        <option value="train">Train</option>
                    </select>
                    <input type="number" id="publicDistance" placeholder="Enter distance (km)">
            
                    <!-- Question 3 -->
                    <label>How far have you traveled by flight?</label>
                    <select id="flightType">
                        <option value="short">Short Haul (Less than 4 hrs)</option>
                        <option value="long">Long Haul (More than 4 hrs)</option>
                    </select>
                    <input type="number" id="flightDistance" placeholder="Enter distance (km)">
            
                    <button class="finalbuttons" onclick="flipCard('card-two')">Next</button>
                </div>
                <div id="card-two" class="flip-card-hidden">
                    <div class="card-content">
                        <img src="" alt="Energy Consumption Image">
                        <label for="electricity">How many kWh of electricity you used?</label>
                        <input type="number" id="electricity" placeholder="Enter kWh">
                        
                        <label for="lpg">How many kg of LPG you used?</label>
                        <input type="number" id="lpg" placeholder="Enter kg">
                        
                        <label for="natural-gas">How many metric cubic natural gas you used?</label>
                        <input type="number" id="natural-gas" placeholder="Enter m³">
            
                        <button class="finalbuttons" onclick="flipCard('card-three')">Next</button>
                    </div>
                </div>
                <div id="card-three" class="flip-card-hidden">
                    <img src="" alt="">
                    <button class="finalbuttons">Next</button>
                </div>
                <div id="card-four" class="flip-card-hidden">
                    <img src="" alt="">
                    <button class="finalbuttons">Submit</button>
                </div>    
          </div>
        </div>
    </section>

    <script src="calculator.js"></script>
</body>
</html>
